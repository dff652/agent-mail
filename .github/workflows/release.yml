name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  gate:
    name: TypeScript release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/agent-mail/npm-shrinkwrap.json
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential shellcheck
      - name: Install exact dependencies
        working-directory: packages/agent-mail
        run: npm ci
      - name: Tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/agent-mail/package.json').version")"
          test "$TAG" = "$VERSION" || {
            echo "::error::tag $TAG does not match package version $VERSION"
            exit 1
          }
      - name: TypeScript contract gate
        env:
          SKIP_NPM_CI: "1"
        run: bash scripts/run_contracts_ts.sh
      - name: TypeScript release check
        run: bash scripts/release_check_ts.sh
      - name: Build npm tarball, SBOM, and checksums
        run: bash scripts/build-release-artifacts.sh dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Artifacts built from $GITHUB_SHA: npm tarball, CycloneDX SBOM, SHA256SUMS, and provenance attestation."
