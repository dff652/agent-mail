<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc"
     font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">Agent Mail — async mailbox for coding agents</title>
  <desc id="desc">Claude, Codex, and Grok exchange messages and tasks through a local-first asynchronous mailbox while a human keeps approval control.</desc>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4FD1C5"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71879D"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#07111F"/>

  <g id="title-block" transform="translate(56 54)">
    <text x="0" y="0"
          fill="#4FD1C5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="700" letter-spacing="2">
      LOCAL-FIRST / ASYNC TASK BUS
    </text>

    <text x="0" y="84"
          fill="#F7FAFC"
          font-size="72" font-weight="700" letter-spacing="-2">
      Agent <tspan fill="#4FD1C5">Mail</tspan>
    </text>

    <text x="0" y="132"
          fill="#D7E2EC"
          font-size="29" font-weight="500">
      Async mailbox for coding agents.
    </text>
    <text x="0" y="174"
          fill="#93A4B8"
          font-size="22" font-weight="400">
      Messages, Markdown and tasks — without a human relay.
    </text>

    <g id="metadata" transform="translate(0 230)"
       font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="18" font-weight="600">
      <rect x="0" y="0" width="118" height="38" rx="19"
            fill="#0D1B2A" stroke="#294158" stroke-width="2"/>
      <text x="59" y="25" text-anchor="middle" fill="#D7E2EC">MCP + CLI</text>

      <rect x="132" y="0" width="126" height="38" rx="19"
            fill="#0D1B2A" stroke="#294158" stroke-width="2"/>
      <text x="195" y="25" text-anchor="middle" fill="#D7E2EC">Node 20+</text>

      <rect x="272" y="0" width="158" height="38" rx="19"
            fill="#0D1B2A" stroke="#F6C453" stroke-width="2"/>
      <text x="351" y="25" text-anchor="middle" fill="#F6C453">approve-writes</text>
    </g>
  </g>

  <g id="agent-route">
    <path d="M 768 130 C 768 153, 803 164, 832 177"
          fill="none" stroke="#71879D" stroke-width="3"
          marker-end="url(#arrow-muted)"/>
    <path d="M 1007 130 C 1007 153, 973 164, 944 177"
          fill="none" stroke="#4FD1C5" stroke-width="3"
          marker-end="url(#arrow-teal)"/>
    <path d="M 888 261 V 298"
          fill="none" stroke="#4FD1C5" stroke-width="3"
          marker-end="url(#arrow-teal)"/>

    <g id="claude-node">
      <rect x="684" y="58" width="168" height="72" rx="18"
            fill="#0D1B2A" stroke="#294158" stroke-width="2"/>
      <circle cx="716" cy="94" r="9" fill="#71879D"/>
      <text x="740" y="103"
            fill="#F7FAFC"
            font-size="25" font-weight="600">Claude</text>
    </g>

    <g id="codex-node">
      <rect x="923" y="58" width="168" height="72" rx="18"
            fill="#0D1B2A" stroke="#4FD1C5" stroke-width="2"/>
      <circle cx="955" cy="94" r="9" fill="#4FD1C5"/>
      <text x="979" y="103"
            fill="#F7FAFC"
            font-size="25" font-weight="600">Codex</text>
    </g>

    <g id="mail-envelope">
      <rect x="788" y="172" width="200" height="90" rx="20"
            fill="#0D1B2A" stroke="#4FD1C5" stroke-width="3"/>
      <path d="M 809 196 L 888 233 L 967 196"
            fill="none" stroke="#4FD1C5" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 809 240 L 850 215 M 967 240 L 926 215"
            fill="none" stroke="#294158" stroke-width="3"
            stroke-linecap="round"/>
      <circle cx="971" cy="183" r="10" fill="#F6C453"/>
    </g>

    <g id="grok-node">
      <rect x="804" y="305" width="168" height="58" rx="18"
            fill="#0D1B2A" stroke="#4FD1C5" stroke-width="2"/>
      <circle cx="836" cy="334" r="9" fill="#4FD1C5"/>
      <text x="860" y="343"
            fill="#F7FAFC"
            font-size="25" font-weight="600">Grok</text>
    </g>

  </g>
</svg>
